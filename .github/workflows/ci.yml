name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: JDK configuration
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + Tests
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  smoke-test-compose:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat <<END > .env
          DATABASE_NAME=buhosapp_ci
          DATABASE_USERNAME=ci_user
          DATABASE_PASSWORD=ci_password
          SPRING_JPA_SHOW_SQL=false
          SPRING_JPA_HIBERNATE_DDL=update
          SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
          SPRING_APPLICATION_NAME=app-test
          END

      - name: Docker compose up
        run: docker compose up --build -d

      - name: Wait for app response
        run: |
          for i in $(seq 1 15); do
            if curl -s http://localhost:8080/api/role/get/nonexistent -o /dev/null; then
              echo "The application responded correctly."
              exit 0
            fi
            echo "Waiting for the app to start... ($i/15)"
            sleep 3
          done
          echo "The app never responded on time"
          exit 1

      - name: Debug Docker Logs
        if: failure()
        run: |
          echo "--- LOGS DE LA APLICACIÓN ---"
          docker compose logs app
          echo "--- LOGS DE LA BASE DE DATOS ---"
          docker compose logs db

      - name: Shutdown
        if: always()
        run: docker compose down -v